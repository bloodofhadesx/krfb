name: Build krfb

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt update -qq
          apt install -y -qq --no-install-recommends \
            build-essential cmake pkg-config \
            extra-cmake-modules \
            qt6-base-dev qt6-base-private-dev \
            libkf6config-dev libkf6coreaddons-dev \
            libkf6i18n-dev libkf6dbusaddons-dev \
            libkf6dnssd-dev libkf6notifications-dev \
            libkf6wallet-dev libkf6widgetsaddons-dev \
            libkf6windowsystem-dev libkf6xmlgui-dev \
            libkf6crash-dev libkf6doctools-dev \
            libkf6statusnotifieritem-dev \
            libkf6completion-dev \
            libx11-dev libxext-dev libxdamage-dev libxtst-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-damage0-dev \
            libxcb-shm0-dev libxcb-image0-dev \
            libvncserver-dev libjpeg62-turbo-dev libepoxy-dev \
            libkpipewire-dev kwayland-dev \
            libpipewire-0.3-dev libwayland-dev \
            qt6-wayland-dev plasma-wayland-protocols \
            libwayland-bin

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Install
        run: cmake --install build --prefix /usr

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          cp -r /usr/bin/krfb* /usr/lib/x86_64-linux-gnu/qt6/plugins/krfb/ artifacts/ 2>/dev/null || true
          cp -r /usr/share/krfb artifacts/ 2>/dev/null || true
          find artifacts -type f | head -30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: krfb-trixie-build
          path: artifacts/
